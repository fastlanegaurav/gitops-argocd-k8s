name: CI — Build, Test & Push Docker Image

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'

env:
  REGISTRY: docker.io
  IMAGE_OWNER: fastlanegaurav

jobs:
  # ─── Lint & Test ────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, auth-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.service == 'backend' || matrix.service == 'auth-service'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: matrix.service == 'backend' || matrix.service == 'auth-service'
        run: |
          cd apps/${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint (flake8)
        if: matrix.service == 'backend' || matrix.service == 'auth-service'
        run: |
          cd apps/${{ matrix.service }}
          flake8 src/ --max-line-length=120 --exclude=__pycache__

      - name: Run unit tests with coverage
        if: matrix.service == 'backend' || matrix.service == 'auth-service'
        run: |
          cd apps/${{ matrix.service }}
          pytest src/tests/ -v --cov=src --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        if: matrix.service == 'backend' || matrix.service == 'auth-service'
        uses: codecov/codecov-action@v4
        with:
          files: apps/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}

  # ─── Security Scan ──────────────────────────────────────────────
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service: [backend, frontend, auth-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: |
          docker build -t ${{ env.IMAGE_OWNER }}/${{ matrix.service }}:scan \
            apps/${{ matrix.service }}/

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_OWNER }}/${{ matrix.service }}:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ─── Build & Push ───────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        service: [backend, frontend, auth-service]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      short-sha: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}

      - name: Update Helm image tag
        if: github.ref == 'refs/heads/main'
        run: |
          SHA="${{ steps.vars.outputs.sha_short }}"
          ENV="dev"

          # Update values-dev.yaml with new image tag
          sed -i "s/tag: .*/tag: \"sha-${SHA}\"/" helm/microservices/values-dev.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/microservices/values-dev.yaml
          git commit -m "chore(gitops): update ${{ matrix.service }} image tag to sha-${SHA} [skip ci]"
          git push

  # ─── Helm Lint ──────────────────────────────────────────────────
  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm charts
        run: |
          helm lint helm/microservices/ -f helm/microservices/values.yaml
          helm lint helm/microservices/ -f helm/microservices/values-dev.yaml
          helm lint helm/microservices/ -f helm/microservices/values-staging.yaml
          helm lint helm/microservices/ -f helm/microservices/values-prod.yaml

      - name: Template render check
        run: |
          helm template test-release helm/microservices/ \
            -f helm/microservices/values.yaml \
            -f helm/microservices/values-dev.yaml \
            --debug > /dev/null
