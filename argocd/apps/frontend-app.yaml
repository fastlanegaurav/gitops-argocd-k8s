apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-dev
  namespace: argocd
  labels:
    app: frontend
    environment: dev
spec:
  project: gitops-project
  source:
    repoURL: https://github.com/fastlanegaurav/gitops-argocd-k8s.git
    targetRevision: HEAD
    path: helm/microservices
    helm:
      releaseName: frontend-dev
      valueFiles:
        - values.yaml
        - values-dev.yaml
      parameters:
        - name: image.repository
          value: fastlanegaurav/frontend
        - name: service.name
          value: frontend
        - name: ingress.hosts[0].host
          value: frontend.dev.local
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

