apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitops-platform-alerts
  namespace: monitoring
  labels:
    app: prometheus
    release: monitoring
spec:
  groups:
    - name: gitops.sre.alerts
      interval: 30s
      rules:
        - alert: ServiceDown
          expr: up{job=~"backend|frontend|auth-service"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Service {{ $labels.job }} is down"
            description: "{{ $labels.job }} has been unreachable for > 1 minute. MTTR clock started."
            runbook: "https://github.com/fastlanegaurav/gitops-argocd-k8s/docs/ROLLBACK.md"

        - alert: HighErrorRate
          expr: |
            rate(backend_requests_total{status=~"5.."}[5m])
            / rate(backend_requests_total[5m]) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High 5xx error rate on {{ $labels.endpoint }}"
            description: "Error rate is {{ $value | humanizePercentage }} — exceeds 5% SLO threshold"

        - alert: HighLatency
          expr: |
            histogram_quantile(0.99,
              rate(backend_request_latency_seconds_bucket[5m])
            ) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "P99 latency > 2s on {{ $labels.endpoint }}"
            description: "P99 latency is {{ $value | humanizeDuration }}"

        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Pod has restarted {{ $value | printf \"%.0f\" }} times in 15 minutes"

        - alert: HPAMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas
            == kube_horizontalpodautoscaler_spec_max_replicas
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "HPA at max replicas for {{ $labels.horizontalpodautoscaler }}"
            description: "Consider increasing maxReplicas in values-prod.yaml"
