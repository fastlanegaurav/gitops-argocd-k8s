# Staging environment overrides
replicaCount: 2

image:
  tag: "staging-latest"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 400m
    memory: 400Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

env:
  - name: APP_ENV
    value: "staging"
  - name: LOG_LEVEL
    value: "info"
  - name: PORT
    value: "5000"

ingress:
  hosts:
    - host: backend.staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: backend-staging-tls
      hosts:
        - backend.staging.example.com
